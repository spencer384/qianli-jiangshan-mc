<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>江山千里 · 3D 方塊卷 (3D-Minecraft) — 方琮《仿王希孟江山千里卷》</title>
  <style>
    :root {
      --mc-panel: rgba(34, 38, 42, 0.88);
      --mc-border: #626b73;
      --mc-highlight: #52c47b;
      --mc-gold: #ffd454;
      --mc-text: #f3f5f7;
      --mc-muted: #b0b8c0;
      --seal-red: #b8362a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8cc2e8;
      font-family: "Noto Serif TC", "Microsoft JhengHei", monospace, sans-serif;
      color: var(--mc-text);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    .title-badge {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--mc-panel);
      border: 2px solid var(--mc-border);
      box-shadow: 0 4px 0 #181b1e, 0 8px 20px rgba(0, 0, 0, 0.35);
      max-width: 440px;
    }

    .seal-stamp {
      width: 36px;
      height: 36px;
      background: var(--seal-red);
      border: 2px solid #e6a89e;
      color: #fff5e6;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.05;
      flex-shrink: 0;
    }

    .title-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--mc-gold);
    }

    .title-text p {
      font-size: 11px;
      color: var(--mc-muted);
      margin-top: 2px;
    }

    .toolbar {
      position: fixed;
      top: 16px;
      right: 18px;
      z-index: 10;
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 6px 8px;
      background: var(--mc-panel);
      border: 2px solid var(--mc-border);
      box-shadow: 0 4px 0 #181b1e;
    }

    .tool-btn {
      background: #484f56;
      border: 2px solid #727b84;
      color: var(--mc-text);
      font-size: 12.5px;
      font-family: inherit;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .tool-btn:hover {
      background: #5a636c;
      border-color: #a3aeb8;
    }

    .tool-btn.active {
      background: #2f7d4d;
      border-color: var(--mc-highlight);
      color: #ffffff;
    }

    .tool-btn.tour-active {
      background: #b8362a;
      border-color: #f07b6e;
      color: #ffffff;
    }

    .tool-sep {
      width: 2px;
      height: 20px;
      background: var(--mc-border);
    }

    .zoom-btn {
      width: 28px;
      padding: 5px 0;
      text-align: center;
      font-weight: 700;
    }

    .spots-panel {
      position: fixed;
      top: 72px;
      right: 18px;
      z-index: 10;
      width: 206px;
      background: var(--mc-panel);
      border: 2px solid var(--mc-border);
      box-shadow: 0 4px 0 #181b1e;
      overflow: hidden;
      transition: opacity 0.2s, transform 0.2s;
    }

    .spots-panel.collapsed {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    .spots-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 2px solid var(--mc-border);
    }

    .spots-header {
      font-size: 11.5px;
      color: var(--mc-gold);
      font-weight: 700;
    }

    .spots-close-btn {
      background: none;
      border: none;
      color: var(--mc-muted);
      font-size: 16px;
      cursor: pointer;
    }

    .spots-list {
      max-height: calc(100vh - 210px);
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .spot-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 6px 8px;
      background: #3d4349;
      border: 1px solid #596169;
      color: var(--mc-text);
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
      text-align: left;
    }

    .spot-btn:hover {
      background: #4e565e;
      border-color: #8c96a0;
    }

    .spot-btn.active {
      background: #2f7d4d;
      border-color: var(--mc-highlight);
      color: #ffffff;
    }

    .spot-idx {
      font-size: 10.5px;
      opacity: 0.75;
    }

    .spot-card {
      position: fixed;
      left: 18px;
      bottom: 106px;
      z-index: 10;
      width: 340px;
      background: var(--mc-panel);
      border: 2px solid var(--mc-border);
      box-shadow: 0 4px 0 #181b1e;
      padding: 12px 14px;
      transition: opacity 0.2s, transform 0.2s;
    }

    .spot-card.hidden {
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
    }

    .spot-card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
      padding-right: 16px;
    }

    .spot-card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--mc-gold);
    }

    .spot-card-tag {
      font-size: 11px;
      color: #7ee3a2;
      border: 1px solid #3f8f5c;
      padding: 1px 6px;
    }

    .spot-card-desc {
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--mc-text);
    }

    .spot-card-close {
      position: absolute;
      top: 6px;
      right: 9px;
      background: none;
      border: none;
      color: var(--mc-muted);
      cursor: pointer;
      font-size: 16px;
    }

    .minimap-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 10;
      width: min(860px, calc(100vw - 36px));
      background: var(--mc-panel);
      border: 2px solid var(--mc-border);
      box-shadow: 0 4px 0 #181b1e;
      padding: 8px 12px;
    }

    .minimap-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--mc-muted);
      margin-bottom: 5px;
    }

    .minimap-track {
      position: relative;
      width: 100%;
      height: 44px;
      border: 2px solid #525960;
      overflow: hidden;
      cursor: pointer;
      background: #2b3136;
    }

    #minimap-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    #minimap-viewport {
      position: absolute;
      top: 0;
      bottom: 0;
      border: 2px solid var(--mc-gold);
      background: rgba(255, 212, 84, 0.16);
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .title-badge {
        top: 10px;
        left: 10px;
        right: 10px;
        max-width: none;
        padding: 7px 10px;
      }
      .toolbar {
        top: 66px;
        left: 10px;
        right: 10px;
        justify-content: space-between;
        overflow-x: auto;
      }
      .spots-panel {
        top: 112px;
        right: 10px;
        width: 176px;
        z-index: 15;
      }
      .spot-card {
        left: 10px;
        right: 10px;
        bottom: 92px;
        width: auto;
      }
      .minimap-bar {
        left: 10px;
        right: 10px;
        bottom: 10px;
        transform: none;
        width: auto;
      }
      #coords-hint {
        display: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="title-badge">
    <div class="seal-stamp">方塊<br/>江山</div>
    <div class="title-text">
      <h1>江山千里 · 3D 方塊卷 (3D-Minecraft)</h1>
      <p>Minecraft 體素方塊重構 · 清·方琮仿王希孟青綠山水長卷</p>
    </div>
  </div>

  <div class="toolbar">
    <button id="btn-3d" class="tool-btn active">3D 視圖</button>
    <button id="btn-scroll" class="tool-btn">長卷視圖</button>
    <div class="tool-sep"></div>
    <button id="btn-zoom-in" class="tool-btn zoom-btn" title="放大">＋</button>
    <button id="btn-zoom-out" class="tool-btn zoom-btn" title="縮小">－</button>
    <div class="tool-sep"></div>
    <button id="btn-reset" class="tool-btn">復位</button>
    <button id="btn-tour" class="tool-btn">導覽</button>
    <button id="btn-spots-toggle" class="tool-btn active">分段</button>
  </div>

  <aside id="spots-panel" class="spots-panel">
    <div class="spots-header-row">
      <div class="spots-header">方塊分段（右→左）</div>
      <button id="spots-close" class="spots-close-btn" title="收合分段">×</button>
    </div>
    <div id="spots-list" class="spots-list"></div>
  </aside>

  <div id="spot-card" class="spot-card hidden">
    <button id="spot-card-close" class="spot-card-close" title="關閉">×</button>
    <div class="spot-card-header">
      <span id="spot-card-title" class="spot-card-title"></span>
      <span id="spot-card-tag" class="spot-card-tag"></span>
    </div>
    <div id="spot-card-desc" class="spot-card-desc"></div>
  </div>

  <div class="minimap-bar">
    <div class="minimap-header">
      <span>← 卷尾雙峰（左）　｜　方塊長卷縮圖（點擊或拖曳瀏覽全卷）　｜　卷首四印（右）→</span>
      <span id="coords-hint">左鍵移動 · 右鍵旋轉 · 滾輪縮放（手機：單指移動·雙指旋轉縮放）</span>
    </div>
    <div id="minimap-track" class="minimap-track">
      <canvas id="minimap-canvas" width="840" height="44"></canvas>
      <div id="minimap-viewport"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
